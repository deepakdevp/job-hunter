searches:
  # ── Japan (highest priority) ──────────────────────────────────
  - query: "software engineer"
    location: "Tokyo, Japan"
    boards: ["indeed", "linkedin", "glassdoor"]
    max_results: 100
    remote_only: false

  - query: "full stack developer"
    location: "Tokyo, Japan"
    boards: ["indeed", "linkedin"]
    max_results: 100

  - query: "frontend engineer react"
    location: "Japan"
    boards: ["indeed", "linkedin"]
    max_results: 50

  - query: "backend engineer python django"
    location: "Japan"
    boards: ["indeed", "linkedin"]
    max_results: 50

  - query: "AI engineer"
    location: "Japan"
    boards: ["indeed", "linkedin"]
    max_results: 50

  - query: "LLM engineer"
    location: "Japan"
    boards: ["indeed", "linkedin"]
    max_results: 50

  - query: "agentic AI"
    location: "Japan"
    boards: ["indeed", "linkedin"]
    max_results: 50

  # ── Europe ────────────────────────────────────────────────────
  - query: "software engineer"
    location: "Europe"
    boards: ["indeed", "linkedin", "glassdoor"]
    max_results: 100
    remote_only: false

  - query: "full stack developer"
    location: "Germany"
    boards: ["indeed", "linkedin"]
    max_results: 50

  - query: "AI engineer"
    location: "Europe"
    boards: ["indeed", "linkedin"]
    max_results: 50

  - query: "full stack engineer"
    location: "Netherlands"
    boards: ["indeed", "linkedin"]
    max_results: 50

  # ── Remote / Global ──────────────────────────────────────────
  - query: "software engineer remote"
    location: "Remote"
    boards: ["indeed", "linkedin"]
    max_results: 50
    remote_only: true

  - query: "AI agent engineer remote"
    location: "Remote"
    boards: ["indeed", "linkedin"]
    max_results: 50
    remote_only: true

