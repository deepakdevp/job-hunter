[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-hunter"
version = "0.1.0"
description = "AI-powered job search: discover, score, tailor resumes, track in Notion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Deepak Dev Panwar", email = "deepakdevp@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
claude = [
    "anthropic>=0.30",
]
openai = [
    "openai>=1.0",
]
notion = [
    "notion-client>=2.0",
]
pdf = [
    "weasyprint>=62",
]
apply = [
    "playwright>=1.40",
]
jobspy = [
    "python-jobspy>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]
all = [
    "job-hunter[gemini,claude,openai,notion,pdf,apply,jobspy]",
]

[project.urls]
Homepage = "https://github.com/deepakdevp/job-hunter"
Repository = "https://github.com/deepakdevp/job-hunter"
Issues = "https://github.com/deepakdevp/job-hunter/issues"
Changelog = "https://github.com/deepakdevp/job-hunter/blob/main/CHANGELOG.md"

[project.scripts]
hunt = "job_hunter.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
