[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-hunter"
version = "0.1.0"
description = "AI-powered job hunting CLI with Notion integration"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "notion-client>=2.2",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "google-generativeai>=0.7",
    "anthropic>=0.25",
    "playwright>=1.44",
    "weasyprint>=62.0",
    "rich>=13.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
jobspy = ["python-jobspy==1.1.82"]

[project.scripts]
hunt = "src.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]
