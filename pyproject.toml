[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-hunter"
version = "0.1.0"
description = "AI-powered job search: discover, score, tailor resumes, track in Notion"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "notion-client>=2.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "weasyprint>=62",
    "playwright>=1.40",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]
jobspy = [
    "python-jobspy>=1.1",
]
crawlee = [
    "crawlee[playwright]>=0.5",
]

[project.scripts]
hunt = "job_hunter.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
